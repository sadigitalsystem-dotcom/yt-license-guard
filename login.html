<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - لوحة إدارة YouTube PLUS+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #09090b; }
    .glass-box {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-zinc-100">

  <div class="w-full max-w-md glass-box rounded-3xl p-8 shadow-2xl shadow-red-950/20 text-center relative overflow-hidden">
    <!-- توهج جمالي في الخلفية -->
    <div class="absolute -top-20 -left-20 w-40 h-40 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- شعار المنظومة -->
    <div class="w-16 h-16 rounded-2xl bg-red-600 mx-auto flex items-center justify-center text-white shadow-xl shadow-red-600/30 mb-5">
      <i class="fa-brands fa-youtube text-3xl"></i>
    </div>

    <h1 class="text-xl sm:text-2xl font-black tracking-tight">
      YouTube <span class="text-red-500">PLUS+</span>
    </h1>
    <p class="text-xs text-zinc-400 mt-1 mb-8">
      لوحة التحكم والإدارة الآمنة لتراخيص الأجهزة
    </p>

    <!-- نموذج تسجيل الدخول -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-right">
      <div>
        <label class="block text-xs font-bold text-zinc-300 mb-1.5">البريد الإلكتروني للإدارة</label>
        <div class="relative">
          <input 
            type="email" 
            id="adminEmail" 
            required 
            placeholder="sa.digitalsystem@gmail.com" 
            class="w-full bg-zinc-900/90 border border-zinc-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-red-500 transition pl-10"
          >
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-zinc-500 text-xs"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-zinc-300 mb-1.5">كلمة المرور</label>
        <div class="relative">
          <input 
            type="password" 
            id="adminPassword" 
            required 
            placeholder="••••••••••••" 
            class="w-full bg-zinc-900/90 border border-zinc-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-red-500 transition pl-10"
          >
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-zinc-500 text-xs"></i>
        </div>
      </div>

      <div id="errorAlert" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center font-bold"></div>

      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-600/30 flex items-center justify-center gap-2 text-sm mt-2"
      >
        <span>تسجيل الدخول للوحة التحكم</span>
        <i class="fa-solid fa-arrow-left text-xs"></i>
      </button>
    </form>

    <div class="mt-8 pt-4 border-t border-zinc-800 text-[11px] text-zinc-500">
      منظومة التراخيص والحماية المشفرة © 2026 YouTube PLUS+
    </div>
  </div>

  <script>
    const API_BASE = '';

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const errBox = document.getElementById('errorAlert');
      const btn = document.getElementById('submitBtn');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري التحقق...</span>';

      try {
        const res = await fetch(`${API_BASE}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.status === 'success') {
          window.location.href = '/ds-portal';
        } else {
          errBox.innerText = data.message || 'بيانات الدخول غير صحيحة';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = 'تعذر الاتصال بالسيرفر! يرجى التأكد من اتصال الإنترنت.';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>تسجيل الدخول للوحة التحكم</span> <i class="fa-solid fa-arrow-left text-xs"></i>';
      }
    }
  </script>
</body>
</html>
