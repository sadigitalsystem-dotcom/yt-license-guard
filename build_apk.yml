name: Build YouTube PLUS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p release_apk
          cp android_app/app/build/outputs/apk/debug/app-debug.apk release_apk/YouTube_PLUS.apk
          echo "APK built successfully:"
          ls -lh release_apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTube_PLUS_APK
          path: release_apk/YouTube_PLUS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "YouTube PLUS+ (يوتيوب بلس+) v1.1.0"
          body: |
            ### تطبيق (يوتيوب بلس+) YouTube PLUS+ للأندرويد
            
            - بوابة حماية وقفل واشتراكات متصلة بلوحة التحكم السحابية.
            - يتطلب كود تفعيل لتشغيل يوتيوب بلس بدون إعلانات وبالميزات الكاملة.
            - اضغط على **YouTube_PLUS.apk** بالأسفل لتحميله وتثبيته مباشرة على هاتفك.
          files: release_apk/YouTube_PLUS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
