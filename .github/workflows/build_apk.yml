name: Build YouTube PLUS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build YouTube PLUS Unified APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Unified YouTube PLUS APK
        run: |
          set -e
          echo "======================================================="
          echo "🚀 Starting YouTube PLUS+ Build Pipeline"
          echo "======================================================="

          # 1. تنزيل الأدوات (Apktool & Uber-APK-Signer)
          echo "=== 1. Downloading Build Tools ==="
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

          # 2. تنزيل ملف YouTube Premium الأساسي
          echo "=== 2. Downloading YouTube Premium Base APK ==="
          curl -f -sL "https://github.com/sadigitalsystem-dotcom/yt-license-guard/releases/download/v1.0.0/%40DevRabie.YouTube.apk" -o base_youtube.apk
          echo "Downloaded APK size: $(ls -lh base_youtube.apk | awk '{print $5}')"

          # 3. فك ملف يوتيوب بدون فك المصادر البرمجية (-s) للحفاظ على كود يوتيوب الأصلي
          echo "=== 3. Unpacking Base APK (preserving raw dex) ==="
          java -jar apktool.jar d -s base_youtube.apk -o yt_unpacked

          # 4. تجميع كود شاشة الحماية GatekeeperActivity مباشرة إلى Dex
          echo "=== 4. Compiling GatekeeperActivity ==="
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORMS_DIR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          PLATFORM_JAR="$PLATFORMS_DIR/android.jar"
          D8_BIN="$BUILD_TOOLS_DIR/d8"
          chmod +x "$D8_BIN" || true

          echo "Using Platform JAR: $PLATFORM_JAR"
          echo "Using D8 Binary: $D8_BIN"

          mkdir -p /tmp/classes
          javac -cp "$PLATFORM_JAR" -d /tmp/classes android_app/app/src/main/java/com/ytplus/guard/GatekeeperActivity.java

          mkdir -p /tmp/dex
          "$D8_BIN" --lib "$PLATFORM_JAR" --output /tmp/dex /tmp/classes/com/ytplus/guard/*.class

          # 5. حقن classes9.dex مباشرة في الحزمة
          echo "=== 5. Injecting Gatekeeper Dex ==="
          cp /tmp/dex/classes.dex yt_unpacked/classes9.dex
          echo "Injected classes9.dex: $(ls -lh yt_unpacked/classes9.dex | awk '{print $5}')"

          # 6. تعديل AndroidManifest.xml
          echo "=== 6. Updating AndroidManifest.xml ==="
          python3 - << 'EOF'
          with open('yt_unpacked/AndroidManifest.xml', 'r', encoding='utf-8') as f:
              content = f.read()

          # تعديل اسم التطبيق الرسمي
          content = content.replace('android:label="@string/application_name"', 'android:label="(يوتيوب بلس+) YouTube PLUS+"')

          # إلغاء أيقونة التشغيل السابقة
          content = content.replace('<category android:name="android.intent.category.LAUNCHER"/>', '<!-- launcher switched -->')

          # إضافة GatekeeperActivity كنشاط التشغيل الرئيسي الوحيد
          gatekeeper = '''
                  <activity
                      android:name="com.ytplus.guard.GatekeeperActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          '''
          content = content.replace('</application>', gatekeeper)

          with open('yt_unpacked/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(content)

          print('✅ AndroidManifest.xml updated successfully!')
          EOF

          # 7. إعادة بناء التطبيق الموحد
          echo "=== 7. Building Unified APK ==="
          java -jar apktool.jar b yt_unpacked -o /tmp/unsigned_unified.apk

          # 8. التوقيع الرقمي
          echo "=== 8. Signing APK with Uber-APK-Signer ==="
          mkdir -p release_apk
          java -jar uber-apk-signer.jar --apks /tmp/unsigned_unified.apk --out release_apk/ --allowResign

          SIGNED_APK=$(find release_apk -type f -name "*aligned-debugSigned.apk" | head -n 1)
          if [ -z "$SIGNED_APK" ]; then
              SIGNED_APK=$(find release_apk -type f -name "*.apk" | head -n 1)
          fi

          cp "$SIGNED_APK" release_apk/YouTube_PLUS.apk

          echo "======================================================="
          echo "🎉 Unified Single APK Ready: release_apk/YouTube_PLUS.apk"
          ls -lh release_apk/YouTube_PLUS.apk
          echo "======================================================="

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTube_PLUS_APK
          path: release_apk/YouTube_PLUS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "YouTube PLUS+ (يوتيوب بلس+) v2.0.0"
          body: |
            ### تطبيق (يوتيوب بلس+) YouTube PLUS+ المدمج 100% للأندرويد
            
            - تطبيق واحد متكامل يجمع شاشة القفل وتفعيل الأكواد ومحرك YouTube Premium الأصلي بداخله.
            - محمي بنظام التراخيص المتصل بسيرفرك السحابي.
            - بدون إعلانات نهائياً، مع تشغيل في الخلفية وميزات البريميوم الكاملة.
            - اضغط على **YouTube_PLUS.apk** بالأسفل لتحميله وتثبيته مباشرة على هاتفك أو شاشتك.
          files: release_apk/YouTube_PLUS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
