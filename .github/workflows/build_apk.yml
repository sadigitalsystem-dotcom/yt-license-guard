name: Build YouTube PLUS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build YouTube PLUS Unified APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Unified YouTube PLUS APK
        run: |
          set -e
          echo "======================================================="
          echo "🚀 Starting YouTube PLUS+ Build Pipeline (Universal 64/32-bit)"
          echo "======================================================="

          # 1. تنزيل أحدث أدوات البناء (Apktool v3.0.3 & Uber-APK-Signer)
          echo "=== 1. Downloading Build Tools ==="
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

          # 2. تنزيل حزمة يوتيوب الشاملة (Universal: arm64-v8a + armeabi-v7a)
          echo "=== 2. Downloading Universal Base APK ==="
          curl -f -sL "https://github.com/NoName-exe/revanced-extended/releases/download/157/youtube-morphe-v21.16.256-all.apk" -o base_youtube.apk
          echo "Downloaded APK size: $(ls -lh base_youtube.apk | awk '{print $5}')"

          # 3. فك الحزمة بأحدث إصدار Apktool مع الحفاظ على ملفات DEX الخام (-s)
          echo "=== 3. Unpacking Base APK (preserving raw dex) ==="
          java -jar apktool.jar d -s base_youtube.apk -o yt_unpacked

          # 4. تجميع كود شاشة الحماية GatekeeperActivity مباشرة إلى Dex
          echo "=== 4. Compiling GatekeeperActivity ==="

          # إزالة أي خصائص قديمة
          sed -i '/maxWidth/d' android_app/app/src/main/java/com/ytplus/guard/GatekeeperActivity.java || true

          PLATFORM_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -n 1)
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
          D8_BIN="$BUILD_TOOLS_DIR/d8"
          chmod +x "$D8_BIN" || true

          echo "Using Platform JAR: $PLATFORM_JAR"
          echo "Using D8 Binary: $D8_BIN"

          mkdir -p /tmp/classes
          javac -cp "$PLATFORM_JAR" -d /tmp/classes android_app/app/src/main/java/com/ytplus/guard/GatekeeperActivity.java

          mkdir -p /tmp/dex
          "$D8_BIN" --lib "$PLATFORM_JAR" --output /tmp/dex /tmp/classes/com/ytplus/guard/*.class

          # 5. حقن شاشة الحماية كملف DEX تالي بصورة ديناميكية
          echo "=== 5. Injecting Gatekeeper Dex ==="
          DEX_COUNT=$(ls -1 yt_unpacked/classes*.dex | wc -l)
          NEXT_DEX_INDEX=$((DEX_COUNT + 1))
          NEXT_DEX="classes${NEXT_DEX_INDEX}.dex"
          echo "Existing DEX files count: $DEX_COUNT -> Injecting Gatekeeper as: $NEXT_DEX"
          cp /tmp/dex/classes.dex "yt_unpacked/$NEXT_DEX"
          echo "Injected $NEXT_DEX: $(ls -lh yt_unpacked/$NEXT_DEX | awk '{print $5}')"

          # 6. تعديل AndroidManifest.xml لتعيين GatekeeperActivity كشاشة البداية الوحيدة
          echo "=== 6. Updating AndroidManifest.xml ==="
          python3 - << 'EOF'
          with open('yt_unpacked/AndroidManifest.xml', 'r', encoding='utf-8') as f:
              content = f.read()

          # تعديل اسم التطبيق الرسمي
          content = content.replace('android:label="@string/application_name"', 'android:label="(يوتيوب بلس+) YouTube PLUS+"')

          # إلغاء أيقونة التشغيل السابقة لضمان عدم فتح يوتيوب مباشرة بدون تفعيل
          content = content.replace('<category android:name="android.intent.category.LAUNCHER"/>', '<!-- launcher switched -->')

          # إضافة GatekeeperActivity كنشاط التشغيل الرئيسي الوحيد
          gatekeeper = '''
                  <activity
                      android:name="com.ytplus.guard.GatekeeperActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          '''
          content = content.replace('</application>', gatekeeper)

          with open('yt_unpacked/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(content)

          print('✅ AndroidManifest.xml updated successfully!')
          EOF

          # 7. إعادة بناء التطبيق الموحد
          echo "=== 7. Building Unified APK ==="
          java -jar apktool.jar b yt_unpacked -o /tmp/unsigned_unified.apk --use-aapt2

          # 8. التوقيع الرقمي (v1 + v2 + v3 schemes)
          echo "=== 8. Signing APK with Uber-APK-Signer ==="
          mkdir -p release_apk
          java -jar uber-apk-signer.jar --apks /tmp/unsigned_unified.apk --out release_apk/ --allowResign

          SIGNED_APK=$(find release_apk -type f -name "*aligned-debugSigned.apk" | head -n 1)
          if [ -z "$SIGNED_APK" ]; then
              SIGNED_APK=$(find release_apk -type f -name "*.apk" | head -n 1)
          fi

          cp "$SIGNED_APK" release_apk/YouTube_PLUS.apk

          echo "======================================================="
          echo "🎉 Unified Protected APK Ready: release_apk/YouTube_PLUS.apk"
          ls -lh release_apk/YouTube_PLUS.apk
          echo "======================================================="

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTube_PLUS_APK
          path: release_apk/YouTube_PLUS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "YouTube PLUS+ (يوتيوب بلس+) v2.1.0 (64-bit & 32-bit)"
          body: |
            ### تطبيق (يوتيوب بلس+) YouTube PLUS+ الموحد والمحمي لجميع أجهزة الأندرويد (v2.1.0)
            
            - دعم كامل وشامل لكافة المعالجات الحديثة 64-bit (arm64-v8a) و 32-bit (armeabi-v7a).
            - حل جذري لمشكلة عدم التوافق على هواتف أندرويد 15 الحديثة (مثل تكنو، سامسونج، شاومي، بيكسل).
            - شاشة الحماية وقفل التفعيل (Gatekeeper) مدمجة 100% ولا تفتح التطبيق إلا بمفتاح تنشيط صالح.
            - التحقق التلقائي واللحظي (Heartbeat) من صلاحية المفتاح.
            - بدون إعلانات نهائياً مع تشغيل في الخلفية وميزات بريميوم كاملة.
          files: release_apk/YouTube_PLUS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
